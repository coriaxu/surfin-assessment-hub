<script>
(() => {
  const VENDOR = "../../assets/pdfjs";
  const P = JSON.parse(document.getElementById('payload').textContent);
  const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const SS = 'ld_report_pw';
  const $ = id => document.getElementById(id);
  async function decrypt(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: ub(P.salt), iterations: P.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const buf = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(P.iv) }, key, ub(P.ct)));
    const n = new DataView(buf.buffer).getUint32(0);
    return { meta: JSON.parse(new TextDecoder().decode(buf.subarray(4, 4 + n))), body: buf.subarray(4 + n) };
  }
  function bar(meta, url) {
    const b = document.createElement('div'); b.className = 'bar';
    const t = document.createElement('span'); t.textContent = meta.filename;
    const a = document.createElement('a'); a.href = url; a.download = meta.filename; a.textContent = '下载原文件';
    b.append(t, a); return b;
  }
  async function show({ meta, body }) {
    if (meta.type === 'html') {
      const html = new TextDecoder().decode(body);
      document.open(); document.write(html); document.close(); return;
    }
    const url = URL.createObjectURL(new Blob([body], { type: meta.mime }));
    document.title = meta.filename;
    document.body.replaceChildren(bar(meta, url));
    const box = document.createElement('div'); box.id = 'pages'; document.body.append(box);
    if (meta.type !== 'pdf') { box.innerHTML = '<p class="hint">此文件为演示文稿，请点击右上角下载后用 PowerPoint / Keynote 打开。</p>'; return; }
    box.innerHTML = '<p class="hint">正在渲染…</p>';
    const lib = await import(VENDOR + '/pdf.min.js');
    lib.GlobalWorkerOptions.workerSrc = VENDOR + '/pdf.worker.min.js';
    const doc = await lib.getDocument({ data: body.slice(), cMapUrl: VENDOR + '/cmaps/', cMapPacked: true, standardFontDataUrl: VENDOR + '/standard_fonts/' }).promise;
    box.replaceChildren();
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    for (let i = 1; i <= doc.numPages; i++) {
      const page = await doc.getPage(i), vp = page.getViewport({ scale: 1.5 * ratio });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; c.dataset.page = i; box.append(c);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
    document.body.dataset.rendered = String(doc.numPages);
  }
  async function attempt(pw, remember) {
    const r = await decrypt(pw);
    if (remember) try { sessionStorage.setItem(SS, pw); } catch (_) {}
    await show(r);
  }
  $('gate').addEventListener('submit', async e => {
    e.preventDefault(); $('go').disabled = true; $('err').textContent = '';
    try { await attempt($('pw').value, true); }
    catch (_) { $('err').textContent = '密码不正确，请重试。'; $('go').disabled = false; $('pw').select(); }
  });
  let saved = null; try { saved = sessionStorage.getItem(SS); } catch (_) {}
  if (saved) attempt(saved, false).catch(() => { try { sessionStorage.removeItem(SS); } catch (_) {} });
})();
</script>
